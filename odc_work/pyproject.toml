[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "opendracocli"
version = "0.1.0"
description = "OpenDracoCLI — AI 时代的智能终端 (P5: 打磨与界面细化)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "OpenDracoCLI Contributors" }]
keywords = ["shell", "terminal", "cli", "cross-platform", "ai-terminal", "textual"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
]
dependencies = [
    "rich>=13.7.0",
    "prompt_toolkit>=3.0.0",
    "textual>=0.47,<0.50",
    "pygments>=2.16",
    "tomli>=2.0; python_version < '3.11'",
]

[project.optional-dependencies]
figlet = ["pyfiglet>=1.0"]
test = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
]

[project.scripts]
opendracocli = "opendracocli.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["opendracocli*"]

[tool.setuptools.package-data]
"opendracocli.mappings" = ["*.json"]
"opendracocli.security" = ["*.json"]
"opendracocli.ai.roles" = ["*.json"]
"opendracocli.tui.styles" = ["**/*.tcss", "**/*.toml"]
"opendracocli.tui.styles.themes" = ["*.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
